<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="cadastro.css">
    <link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css"
    rel="stylesheet"/>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Voltar</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="container-cadastro">
            <h1>Cadastro</h1>
            <p>Nome</p>
            <input type="text" placeholder="Digite seu nome" class="usuario-input">
            <hr>
            <p>E-mail</p>
            <input type="email" placeholder="Digite seu e-mail" class="email-input">
            <hr>
            <p>Senha</p>
            <input type="password" placeholder="Digite sua senha" class="senha-input">
            <hr>
            <button>
                Cadastrar-se
            </button>
            <div class="ousecadastre">ou se cadastre usando</div>
            <i class="ri-google-line"></i>
        </div>
    </main>
</body>
</html>
